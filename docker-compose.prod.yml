# docker-compose.prod.yml — Deploy do AgroTelemetry (SPRINT-01)
# Banco unificado: timescale/timescaledb-ha:pg16 traz TimescaleDB + PostGIS.
# Segredos vêm do arquivo .env (NUNCA commitar). Ver DEPLOY.md.
services:
  postgres:
    image: timescale/timescaledb-ha:pg16
    container_name: agro_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      # Só localhost: acesso ao banco de fora é via túnel SSH (nunca exposto à internet).
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/home/postgres/pgdata/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: agro_redis
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # API FastAPI (ingestão + REST). Também inicia o listener MQTT e o worker no mesmo processo.
  api:
    build:
      context: ./python-backend
      dockerfile: Dockerfile
    container_name: agro_api
    env_file: .env
    # RLS ativado (F2.2b): a API conecta como `agro_app` (NÃO-superuser → RLS aplicado). As MIGRAÇÕES
    # e o setup de senhas rodam como DONO (ALEMBIC_DATABASE_URL) no prod_bootstrap, antes do uvicorn.
    command: ["sh", "-c", "python scripts/prod_bootstrap.py && uvicorn main:app --host 0.0.0.0 --port 8000"]
    environment:
      - DATABASE_URL=postgresql+asyncpg://agro_app:${AGRO_APP_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - ALEMBIC_DATABASE_URL=postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      # Painel admin do sistema (F3): conexão privilegiada (agro_sysadmin, BYPASSRLS). SYSADMIN_JWT_SECRET
      # vem do .env (env_file). A rota /api/sys-admin não é linkada no dashboard.
      - SYSADMIN_DATABASE_URL=postgresql+asyncpg://agro_sysadmin:${AGRO_SYSADMIN_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - REDIS_URL=redis://redis:6379/0
      # SPRINT-10/M5: a API não roda ingestão/worker — quem processa é o serviço `worker`.
      - RUN_MQTT=0
      - RUN_WORKER=0
      # Anexos de O.S. (PDF): storage em disco no volume `uploads`. Trocar p/ S3 = STORAGE_BACKEND=s3.
      - STORAGE_BACKEND=disk
      - STORAGE_DIR=/app/data/uploads
    volumes:
      - uploads:/app/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      # Interno: o browser fala com o proxy nginx, não direto com a API. Localhost p/ debug/túnel.
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Frontend Next.js (dashboard). Serve a UI e proxia /api/* pro serviço 'api' na rede interna
  # (rewrite em next.config.js; BACKEND_URL fixado no build). O browser só acessa este serviço.
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        BACKEND_URL: http://api:8000
    container_name: agro_frontend
    depends_on:
      api:
        condition: service_healthy
    ports:
      # Interno: só o proxy nginx acessa o frontend. Localhost p/ debug/túnel.
      - "127.0.0.1:3000:3000"
    healthcheck:
      # 127.0.0.1 (não 'localhost'): dentro do container localhost resolve p/ IPv6 (::1), mas o
      # Next.js escuta em IPv4 (0.0.0.0) → wget em localhost dava "connection refused".
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Reverse proxy (nginx): única porta pública. Roteia /api e /ws → api, resto → frontend.
  # Resolve o WebSocket do dashboard (SPRINT-07) e centraliza o proxy REST na mesma origem.
  proxy:
    image: nginx:1.27-alpine
    container_name: agro_proxy
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      # Certificados TLS (prod): monte a pasta com fullchain.pem/privkey.pem e habilite o
      # server 443 no nginx.conf (ver comentários lá). Em homologação (atrás de VPN) pode ficar só :80.
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"   # TLS (habilite o server 443 no nginx.conf quando tiver certificado)
    restart: unless-stopped

  # Processo de PROCESSAMENTO dedicado (SPRINT-10/M5): ingestão MQTT + worker do Outbox, fora do
  # processo da API (não disputam CPU). O worker paraleliza internamente POR DISPOSITIVO (M6),
  # aproveitando múltiplos núcleos com a ordem preservada por device. Escalar o worker
  # horizontalmente (vários containers) exigiria sharding por device — fica para a fase AWS.
  worker:
    build:
      context: ./python-backend
      dockerfile: Dockerfile
    container_name: agro_worker
    command: ["python", "-m", "workers.run_worker"]
    env_file: .env
    # RLS ativado (F2.2b): a ingestão/worker é processo de SISTEMA (sem contexto de tenant por linha) →
    # conecta como `agro_worker` (BYPASSRLS); a denormalização de org/fazenda é por trigger. Depende da
    # API (service_healthy) para garantir que o prod_bootstrap já criou os papéis e setou as senhas.
    environment:
      - DATABASE_URL=postgresql+asyncpg://agro_worker:${AGRO_WORKER_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  uploads:   # anexos de O.S. (PDF); persistente no VPS. Migrar p/ S3 na fase de escala.
