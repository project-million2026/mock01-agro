# Reverse proxy de produção do AgroTelemetry (SPRINT-07).
# O browser fala SÓ com este proxy (mesma origem):
#   /ws/  → WebSocket do dashboard em tempo real (api:8000, com upgrade)
#   /api/ → REST (api:8000)
#   /     → Next.js (frontend:3000)
# Resolve o WebSocket (o rewrite do Next não encaminha upgrade) e centraliza o proxy REST.
events {}

http {
  upstream api      { server api:8000; }
  upstream frontend { server frontend:3000; }

  # Necessário para o upgrade de WebSocket (Connection: upgrade só quando há Upgrade).
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  server {
    listen 80;

    # WebSocket do dashboard (/ws/dashboard).
    location /ws/ {
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 3600s;   # conexões longas
    }

    # ⚠️ PAINEL ADMIN DO SISTEMA (F3) — poder cross-org (BYPASSRLS). MITIGAÇÃO INTERINA até a fatia 2
    # (IP-allowlist no app + MFA/TOTP): restrinja /api/sys-admin/ por IP AQUI. DESCOMENTE e ponha os
    # IPs da sua VPN/escritório ANTES de expor à internet. (A UI fica em /sys-admin.)
    #   location /api/sys-admin/ {
    #     allow 203.0.113.10;   # seu IP/VPN
    #     deny all;
    #     proxy_pass http://api;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    #   }

    # API REST.
    location /api/ {
      proxy_pass http://api;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # App Next.js (inclui HMR/websocket do dev — inofensivo em prod).
    location / {
      proxy_pass http://frontend;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
  }

  # --- TLS (produção pública) ---------------------------------------------------------------
  # Homologação atrás de VPN pode ficar só no :80 acima. Para PROD público, coloque os
  # certificados em ./certs (montado em /etc/nginx/certs — ver docker-compose.prod.yml e
  # certs/.gitkeep) e DESCOMENTE o bloco abaixo. Opcional: no server :80 acima, troque o corpo por
  # `return 301 https://$host$request_uri;` para forçar HTTPS.
  #
  # server {
  #   listen 443 ssl;
  #   http2 on;
  #   server_name _;
  #   ssl_certificate     /etc/nginx/certs/fullchain.pem;
  #   ssl_certificate_key /etc/nginx/certs/privkey.pem;
  #   ssl_protocols TLSv1.2 TLSv1.3;
  #
  #   location /ws/ {
  #     proxy_pass http://api;
  #     proxy_http_version 1.1;
  #     proxy_set_header Upgrade $http_upgrade;
  #     proxy_set_header Connection $connection_upgrade;
  #     proxy_set_header Host $host;
  #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  #     proxy_set_header X-Forwarded-Proto https;
  #     proxy_read_timeout 3600s;
  #   }
  #   location /api/ {
  #     proxy_pass http://api;
  #     proxy_set_header Host $host;
  #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  #     proxy_set_header X-Forwarded-Proto https;
  #   }
  #   location / {
  #     proxy_pass http://frontend;
  #     proxy_http_version 1.1;
  #     proxy_set_header Upgrade $http_upgrade;
  #     proxy_set_header Connection $connection_upgrade;
  #     proxy_set_header Host $host;
  #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  #     proxy_set_header X-Forwarded-Proto https;
  #   }
  # }
}
