name: CI

# Otimizado para consumo de minutos do Actions:
#  - `concurrency` + cancel-in-progress: um push novo cancela o run anterior do mesmo PR/branch;
#  - `paths-ignore`: mudança só de docs (.md) não roda a suíte;
#  - lint+test consolidados por stack (2 runners em vez de 4 — metade dos setups/instalações);
#  - jobs LEVES (python, frontend, check-gitignore) rodam em todo push/PR — são o gate de verdade;
#  - jobs PESADOS (docker-build, security-scan) NÃO rodam por commit: só no `schedule` semanal e no
#    `workflow_dispatch` manual (validam a imagem/segurança periodicamente e sob demanda). Sem
#    `--no-cache` (usa o cache de layers);
#  - `timeout-minutes` em todos os jobs (nenhum run trava e queima horas).
# NÃO dispare manualmente (`workflow_dispatch`) um PR que já roda pelo gatilho `pull_request` — seria
# consumo dobrado. Use o dispatch só para revalidar sem PR ou p/ forçar o build pesado.
on:
  push:
    branches: [ main, develop ]
    paths-ignore: [ '**/*.md', 'docs/**' ]
  pull_request:
    branches: [ main, develop ]
    paths-ignore: [ '**/*.md', 'docs/**' ]
  schedule:
    - cron: '0 6 * * 1'   # seg 06:00 UTC — validação semanal da imagem Docker + scan de segurança
  workflow_dispatch:

# dorny/paths-filter lê os arquivos alterados do PR via API → precisa de pull-requests: read.
permissions:
  contents: read
  pull-requests: read

concurrency:
  # PR → agrupa pelo número (novos commits cancelam o run em voo); push/dispatch → pela ref.
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------
  # CHANGES — detecta o que mudou p/ rodar SÓ o job relevante (economia de minutos):
  # commit só de frontend não roda o job python (pytest+Postgres, o mais caro), e vice-versa.
  # ---------------------------------------------------------------------
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      mobile: ${{ steps.filter.outputs.mobile }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'python-backend/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'app/**'
              - 'components/**'
              - 'lib/**'
              - '__tests__/**'
              - 'package.json'
              - 'yarn.lock'
              - 'next.config.*'
              - 'eslint.config.*'
              - 'vitest.config.*'
              - '.github/workflows/ci.yml'
            mobile:
              - 'mobile/**'
              - '.github/workflows/ci.yml'

  # ---------------------------------------------------------------------
  # PYTHON — lint (ruff + mypy) + testes (pytest com Postgres/Redis)
  # Consolidado: mypy precisa das deps instaladas de qualquer forma, então lint e teste
  # compartilham o MESMO setup/instalação (antes eram 2 jobs = 2 instalações).
  # Só roda quando algo do backend mudou (ou no schedule/dispatch).
  # ---------------------------------------------------------------------
  python:
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        # Imagem unificada TimescaleDB + PostGIS (geofencing depende de PostGIS).
        image: timescale/timescaledb-ha:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agro
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('python-backend/requirements.txt') }}
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          pip install -r python-backend/requirements.txt
          pip install mypy pytest pytest-asyncio coverage types-python-jose types-passlib
      - name: Run ruff
        run: ruff check python-backend/
      - name: Run mypy (gate — tree inteiro)
        # Gate obrigatório sobre TODO o backend. Modelos em Mapped[...] (SQLAlchemy 2.0) → sem
        # falsos positivos de Column[X]. --config-file explícito porque o mypy só acha mypy.ini no cwd.
        run: mypy --config-file python-backend/mypy.ini python-backend/
      - name: Run tests with coverage
        run: |
          cd python-backend
          coverage run -m pytest
          coverage xml -o coverage.xml
          coverage report
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: pytest-coverage
          path: python-backend/coverage.xml

  # ---------------------------------------------------------------------
  # FRONTEND — lint (ESLint) + testes (Vitest) + next build. Só roda quando o frontend mudou.
  # ---------------------------------------------------------------------
  frontend:
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "yarn"
      - name: Install deps
        run: yarn install --frozen-lockfile
      - name: Run ESLint
        run: yarn lint
      - name: Run Vitest (unit + coverage)
        run: yarn test
      - name: Build de produção (next build)
        # Gate essencial: eslint/vitest NÃO pegam erros de bundling do `next build` (ex.: dynamic
        # import com path variável) — foi o que travou a imagem Docker do frontend por várias fatias.
        run: yarn build
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: vitest-coverage
          path: coverage/vitest/

  # ---------------------------------------------------------------------
  # MOBILE — app Expo (Android+iOS, base única). Projeto próprio em mobile/ com lockfile próprio.
  # Gate leve: eslint + jest (o build nativo/EAS é sob demanda, não em cada commit). Só roda quando
  # mobile/ mudou. Um commit só-mobile NÃO paga os jobs python/frontend (e vice-versa).
  # ---------------------------------------------------------------------
  mobile:
    needs: changes
    if: ${{ needs.changes.outputs.mobile == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "yarn"
          cache-dependency-path: mobile/yarn.lock
      - name: Install deps
        run: yarn install --frozen-lockfile
      - name: Run ESLint
        run: yarn lint
      - name: Run Jest
        run: yarn test

  # ---------------------------------------------------------------------
  # DOCKER BUILD & VALIDATION — job pesado: só no push para main/develop e no dispatch manual
  # (NÃO em cada commit de PR). Sem --no-cache → aproveita o cache de layers.
  # ---------------------------------------------------------------------
  docker-build:
    # Job pesado: só no schedule semanal e no dispatch manual — não em cada commit.
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [python]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-docker-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-docker-
      - name: Build Docker image (no push)
        run: docker compose -f docker-compose.yml build
      - name: Validate compose configuration
        run: docker compose config

  # ---------------------------------------------------------------------
  # SECURITY SCANS — report-only; só no push para main/develop e no dispatch (não bloqueia PR).
  # ---------------------------------------------------------------------
  security-scan:
    # Report-only: junto do docker-build, só no schedule semanal e no dispatch manual.
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: docker-build
    steps:
      - uses: actions/checkout@v4
      - name: Scan filesystem with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: json
          output: trivy-report.json
          exit-code: "0"          # relatório; não falha por CVE (thresholds = tarefa futura)
          skip-dirs: node_modules,.venv,.next
      - name: pip-audit (report-only)
        run: |
          pip install pip-audit
          pip-audit -r python-backend/requirements.txt --format json > pip-audit.json || true
      - name: Upload security reports
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            trivy-report.json
            pip-audit.json

  # ---------------------------------------------------------------------
  # .gitignore verification — job leve e INDEPENDENTE (roda em todos os gatilhos, custo mínimo).
  # ---------------------------------------------------------------------
  check-gitignore:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify .gitignore hides acesso.env & docs/
        run: |
          git check-ignore -v acesso.env
          git check-ignore -v docs/README.md || true
